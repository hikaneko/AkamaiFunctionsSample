<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAM Chat (Akamai Functions + AAM JWT Auth)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
      .markdown-body { line-height: 1.6; }
      .markdown-body > *:first-child { margin-top: 0; }
      .markdown-body > *:last-child { margin-bottom: 0; }
      .markdown-body p { margin: 0.5em 0; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3,
      .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        font-weight: 600; margin: 1em 0 0.5em;
      }
      .markdown-body h1 { font-size: 1.4em; }
      .markdown-body h2 { font-size: 1.25em; }
      .markdown-body h3 { font-size: 1.1em; }
      .markdown-body ul, .markdown-body ol { margin: 0.5em 0; padding-left: 1.5em; }
      .markdown-body ul { list-style: disc; }
      .markdown-body ol { list-style: decimal; }
      .markdown-body li { margin: 0.25em 0; }
      .markdown-body a { color: #2563eb; text-decoration: underline; }
      .markdown-body strong { font-weight: 600; }
      .markdown-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 1em 0; }
      .markdown-body blockquote {
        border-left: 3px solid #e5e7eb; margin: 0.5em 0; padding-left: 1em; color: #6b7280;
      }
      .markdown-body code {
        background: rgba(0,0,0,0.06); border-radius: 4px; padding: 0.15em 0.35em;
        font-size: 0.9em; font-family: ui-monospace, monospace;
      }
      .markdown-body pre {
        background: #1f2937; color: #f3f4f6; border-radius: 8px; padding: 0.75em 1em;
        overflow-x: auto; margin: 0.5em 0;
      }
      .markdown-body pre code { background: none; padding: 0; color: inherit; }
      .markdown-body table { border-collapse: collapse; margin: 0.5em 0; }
      .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.4em 0.6em; }
      .bg-blue-500 .markdown-body a { color: #dbeafe; }
      .bg-blue-500 .markdown-body code { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

        const ARCH_DIAGRAM = `flowchart LR
    Client["Client (Browser)"]
    subgraph Akamai ["Akamai Functions"]
        F["Wasm Function"]
    end
    subgraph AuthZ ["AAM auth-server"]
        L["/login issues JWT"]
    end
    subgraph AAMGW ["AAM (AI Gateway) — chat-app"]
        GW["jwt-auth-inbound checks JWT"]
    end
    subgraph LLM ["LLM Backend on Akamai Cloud"]
        M["google-gemma-4-e4b-it"]
    end
    Client -->|"1. login"| Akamai
    F -->|"2. proxy /login"| L
    L -->|"3. JWT issued"| Client
    Client -->|"4. chat + JWT"| Akamai
    F -->|"5. proxy /chat (Bearer JWT)"| GW
    GW -->|"6. valid JWT → forward"| M
    M -->|"7. response"| GW
    GW -->|"8. response"| F
    F -->|"9. response"| Client`;

        function ArchDiagram() {
          const ref = useRef(null);
          useEffect(() => {
            if (!ref.current) return;
            mermaid.render('arch-svg', ARCH_DIAGRAM).then(({ svg }) => {
              ref.current.innerHTML = svg;
              const el = ref.current.querySelector('svg');
              if (el) {
                el.style.width = '100%';
                el.style.height = 'auto';
                el.style.minHeight = '520px';
                el.setAttribute('viewBox', el.getAttribute('viewBox') || '0 0 800 400');
                el.removeAttribute('width');
                el.removeAttribute('height');
              }
            });
          }, []);
          return h('div', { ref, className: "w-full" });
        }

        const { useState, useRef, useEffect, createElement: h } = React;
        const LOGIN_URL = '/api/login';
        const GATEWAY_URL = '/api/chat';
        const MODEL = 'google-gemma-4-e4b-it/google/gemma-4-E4B-it';

        const MAX_AUTO_RETRIES = 1;
        const CLIENT_TIMEOUT_MS = 28000;
        const OVERALL_DEADLINE_MS = 60000;
        const RETRY_BACKOFF_MS = 600;
        const LOADING_MESSAGE = 'Generating response…';

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function classifyError(status, err) {
          if (err?.name === 'AbortError') return { kind: 'timeout', retryable: true };
          if (status === 504 || status === 500) return { kind: 'timeout', retryable: true };
          if (status === 502 || status === 503) return { kind: 'upstream', retryable: true };
          if (status === 401 || status === 403) return { kind: 'auth', retryable: false };
          if (status === 429) return { kind: 'rate_limit', retryable: true };
          if (typeof status === 'number') return { kind: 'client', retryable: false };
          return { kind: 'network', retryable: true };
        }

        function errorMessageFor(kind) {
          switch (kind) {
            case 'auth':
              return 'Your session token was rejected. Please log in again.';
            case 'client':
              return 'The request could not be processed. Please check your input and try again.';
            default:
              return 'The response took too long and was cancelled. Please try again.';
          }
        }

        marked.setOptions({ breaks: true, gfm: true });

        function Markdown({ content }) {
          const html = DOMPurify.sanitize(marked.parse(content || ''));
          return h('div', {
            className: "markdown-body",
            dangerouslySetInnerHTML: { __html: html }
          });
        }

        function formatLatency(ms) {
          return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(2)}s`;
        }

        function LoginForm({ onLogin, loading, error }) {
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');

          const submit = (e) => {
            e.preventDefault();
            if (!username || !password) return;
            onLogin(username, password);
          };

          return h('form', { onSubmit: submit, className: "space-y-3" },
            h('div', null,
              h('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, 'Username'),
              h('input', {
                type: "text",
                value: username,
                onChange: (e) => setUsername(e.target.value),
                placeholder: "alice",
                className: "w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              })
            ),
            h('div', null,
              h('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, 'Password'),
              h('input', {
                type: "password",
                value: password,
                onChange: (e) => setPassword(e.target.value),
                placeholder: "••••••••",
                className: "w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              })
            ),
            error && h('p', { className: "text-xs text-red-600" }, error),
            h('button', {
              type: "submit",
              disabled: !username || !password || loading,
              className: "w-full px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-sm font-medium"
            }, loading ? 'Logging in…' : 'Log in')
          );
        }

        function AAMChat() {
          const [token, setToken] = useState('');
          const [loggedInAs, setLoggedInAs] = useState('');
          const [loginLoading, setLoginLoading] = useState(false);
          const [loginError, setLoginError] = useState('');
          const [messages, setMessages] = useState([]);
          const [input, setInput] = useState('');
          const [loading, setLoading] = useState(false);
          const [lastFailedRequest, setLastFailedRequest] = useState(null);
          const messagesEndRef = useRef(null);

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages]);

          const [nodeInfo, setNodeInfo] = useState(null);
          useEffect(() => {
            fetch('/api/info')
              .then(r => r.json())
              .then(d => setNodeInfo(d))
              .catch(() => {});
          }, []);

          const handleLogin = async (username, password) => {
            setLoginLoading(true);
            setLoginError('');
            try {
              const response = await fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
              });
              const data = await response.json();
              if (!response.ok || !data.token) {
                throw new Error(data.error === 'invalid_credentials'
                  ? 'Invalid username or password.'
                  : (data.message || 'Login failed.'));
              }
              setToken(data.token);
              setLoggedInAs(username);
            } catch (err) {
              setLoginError(err.message || 'Login failed.');
            } finally {
              setLoginLoading(false);
            }
          };

          const logOut = () => {
            setToken('');
            setLoggedInAs('');
            setMessages([]);
          };

          const attemptChat = async (payloadMessages) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), CLIENT_TIMEOUT_MS);
            try {
              const response = await fetch(GATEWAY_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                  model: MODEL,
                  messages: payloadMessages.map(m => ({
                    role: m.role,
                    content: m.content
                  }))
                }),
                signal: controller.signal
              });

              if (!response.ok) {
                const errorText = await response.text();
                const err = new Error(`API Error: ${response.status} - ${errorText}`);
                err.status = response.status;
                throw err;
              }

              return await response.json();
            } finally {
              clearTimeout(timer);
            }
          };

          const runChat = async (payloadMessages) => {
            const deadline = performance.now() + OVERALL_DEADLINE_MS;

            for (let attempt = 0; attempt <= MAX_AUTO_RETRIES; attempt++) {
              const startTime = performance.now();
              try {
                const data = await attemptChat(payloadMessages);
                return {
                  role: 'assistant',
                  content: data.choices?.[0]?.message?.content || 'No response',
                  usage: data.usage || null,
                  model: data.model || null,
                  latencyMs: performance.now() - startTime
                };
              } catch (error) {
                const { retryable, kind } = classifyError(error.status, error);
                const hasBudget = performance.now() + RETRY_BACKOFF_MS < deadline;
                const hasAttemptsLeft = attempt < MAX_AUTO_RETRIES;

                if (kind === 'auth') {
                  // Session token rejected — force a fresh login rather than
                  // silently retrying with the same bad token.
                  logOut();
                }

                if (retryable && hasAttemptsLeft && hasBudget) {
                  await sleep(RETRY_BACKOFF_MS);
                  continue;
                }

                return {
                  role: 'assistant',
                  content: errorMessageFor(kind),
                  isError: true
                };
              }
            }
          };

          const sendMessage = async (overrideMessages) => {
            let payloadMessages;
            if (overrideMessages) {
              payloadMessages = overrideMessages;
            } else {
              if (!input.trim() || !token) return;
              const userMessage = { role: 'user', content: input };
              payloadMessages = [...messages, userMessage];
              setMessages(prev => [...prev, userMessage]);
              setInput('');
            }

            setLoading(true);
            setLastFailedRequest(null);
            try {
              const resultMessage = await runChat(payloadMessages);
              setMessages(prev => [...prev, resultMessage]);
              if (resultMessage.isError) {
                setLastFailedRequest(payloadMessages);
              }
            } finally {
              setLoading(false);
            }
          };

          const retryLastMessage = () => {
            if (!lastFailedRequest) return;
            setMessages(prev => {
              const idx = prev.length - 1;
              return idx >= 0 && prev[idx].isError ? prev.slice(0, idx) : prev;
            });
            sendMessage(lastFailedRequest);
          };

          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          };

          return h('div', { className: "flex h-screen bg-gray-100" },
            h('div', { className: "w-80 bg-white border-r border-gray-200 p-6 flex flex-col space-y-6" },
              h('div', null,
                h('h1', { className: "text-xl font-bold text-gray-800 mb-6" }, 'AAM Chat'),
                token
                  ? h('div', { className: "space-y-2" },
                      h('p', { className: "text-sm text-gray-700" }, 'Logged in as ', h('strong', null, loggedInAs)),
                      h('button', {
                        onClick: logOut,
                        className: "text-xs text-gray-500 underline hover:text-gray-700"
                      }, 'Log out')
                    )
                  : h(LoginForm, { onLogin: handleLogin, loading: loginLoading, error: loginError })
              ),

              h('div', { className: "mt-auto pt-6 border-t border-gray-200 space-y-2" },
                h('p', { className: "text-xs text-gray-500" }, 'Akamai Functions → AAM auth-server (login) → AAM (AI Gateway) (jwt-auth-inbound)'),
                nodeInfo && h('div', { className: "text-xs text-gray-400 leading-relaxed" },
                  h('p', null, `Running in ${nodeInfo.city}`),
                  h('p', null, `IP: ${nodeInfo.ip}`)
                )
              )
            ),
            h('div', { className: "flex-1 flex flex-col" },
              h('div', { className: "flex-1 overflow-y-auto p-6 space-y-4" },
                messages.length === 0 ?
                  h('div', { className: "flex flex-col items-center justify-center h-full gap-8 px-4" },
                    h('div', { className: "text-center" },
                      h('h2', { className: "text-2xl font-semibold text-gray-700 mb-2" }, 'AAM Chat'),
                      h('p', { className: "text-gray-400 text-sm" }, token ? 'Start chatting below' : 'Log in in the sidebar to start chatting')
                    ),
                    h('div', { className: "w-full max-w-5xl bg-white border border-gray-200 rounded-xl shadow-sm p-8" },
                      h('p', { className: "text-xs font-semibold text-gray-400 uppercase tracking-widest mb-6" }, 'Architecture'),
                      h('div', { className: "text-lg" },
                        h(ArchDiagram)
                      )
                    )
                  ) :
                  messages.map((msg, idx) =>
                    h('div', {
                      key: idx,
                      className: `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`
                    },
                      h('div', { className: "flex flex-col max-w-3xl items-" + (msg.role === 'user' ? 'end' : 'start') },
                        h('div', {
                          className: `rounded-lg px-4 py-3 ${msg.role === 'user' ? 'bg-blue-500 text-white' : (msg.isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-white text-gray-800 border border-gray-200')}`
                        },
                          msg.role === 'assistant'
                            ? h(Markdown, { content: msg.content })
                            : h('p', { className: "whitespace-pre-wrap" }, msg.content)
                        ),
                        msg.isError && idx === messages.length - 1 &&
                          h('button', {
                            onClick: retryLastMessage,
                            className: "mt-1 px-3 py-1 text-xs font-medium text-red-700 border border-red-200 rounded-md hover:bg-red-50"
                          }, 'Retry'),
                        msg.role === 'assistant' && (msg.usage || msg.model || msg.latencyMs != null) &&
                          h('p', { className: "text-xs text-gray-400 mt-1 px-1" },
                            [
                              msg.model,
                              msg.usage && `prompt: ${msg.usage.prompt_tokens} / completion: ${msg.usage.completion_tokens} / total: ${msg.usage.total_tokens} tokens`,
                              msg.latencyMs != null && formatLatency(msg.latencyMs)
                            ].filter(Boolean).join(' · ')
                          )
                      )
                    )
                  ),
                loading && h('div', { className: "flex justify-start" },
                  h('div', { className: "bg-white text-gray-800 border border-gray-200 rounded-lg px-4 py-3" },
                    LOADING_MESSAGE
                  )
                ),
                h('div', { ref: messagesEndRef })
              ),
              h('div', { className: "border-t border-gray-200 bg-white p-4" },
                h('div', { className: "max-w-4xl mx-auto flex space-x-4" },
                  h('textarea', {
                    value: input,
                    onChange: (e) => setInput(e.target.value),
                    onKeyPress: handleKeyPress,
                    placeholder: token ? "Type your message..." : "Log in first...",
                    disabled: !token || loading,
                    rows: 1,
                    className: "flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none disabled:bg-gray-100 disabled:cursor-not-allowed"
                  }),
                  h('button', {
                    onClick: () => sendMessage(),
                    disabled: !input.trim() || !token || loading,
                    className: "px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                  }, loading ? 'Sending...' : 'Send')
                )
              )
            )
          );
        }

        ReactDOM.render(h(AAMChat), document.getElementById('root'));
    </script>
</body>
</html>
