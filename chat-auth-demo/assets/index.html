<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAM Chat (Akamai Functions + AAM JWT Auth)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .markdown-body { line-height: 1.6; }
      .markdown-body > *:first-child { margin-top: 0; }
      .markdown-body > *:last-child { margin-bottom: 0; }
      .markdown-body p { margin: 0.5em 0; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3,
      .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        font-weight: 600; margin: 1em 0 0.5em;
      }
      .markdown-body h1 { font-size: 1.3em; }
      .markdown-body h2 { font-size: 1.18em; }
      .markdown-body h3 { font-size: 1.08em; }
      .markdown-body ul, .markdown-body ol { margin: 0.5em 0; padding-left: 1.4em; }
      .markdown-body ul { list-style: disc; }
      .markdown-body ol { list-style: decimal; }
      .markdown-body li { margin: 0.25em 0; }
      .markdown-body a { color: #0f172a; text-decoration: underline; text-underline-offset: 2px; }
      .markdown-body strong { font-weight: 600; }
      .markdown-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 1em 0; }
      .markdown-body blockquote {
        border-left: 2px solid #cbd5e1; margin: 0.5em 0; padding-left: 0.9em; color: #64748b;
      }
      .markdown-body code {
        background: #f1f5f9; border-radius: 3px; padding: 0.15em 0.35em;
        font-size: 0.88em; font-family: ui-monospace, monospace;
      }
      .markdown-body pre {
        background: #0f172a; color: #e2e8f0; border-radius: 4px; padding: 0.75em 1em;
        overflow-x: auto; margin: 0.5em 0;
      }
      .markdown-body pre code { background: none; padding: 0; color: inherit; }
      .markdown-body table { border-collapse: collapse; margin: 0.5em 0; }
      .markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 0.4em 0.6em; }
      .bubble-user .markdown-body a { color: #f1f5f9; }
      .bubble-user .markdown-body code { background: rgba(255,255,255,0.14); }
      .diagram-svg text { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useRef, useEffect, createElement: h } = React;

        // ---------------------------------------------------------------
        // Architecture diagram — hand-built inline SVG, restrained palette.
        // Systems are told apart by a small uppercase label, not by
        // decorative colour-coding.
        // ---------------------------------------------------------------

        function svgDefs() {
          return `
            <defs>
              <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
              </marker>
            </defs>
          `;
        }

        function svgBox(x, y, w, h, lines) {
          const cx = x + w / 2;
          const cy = y + h / 2;
          const lineHeight = 18;
          const startY = cy - ((lines.length - 1) * lineHeight) / 2 + 5;
          const text = lines.map((line, i) => {
            const bold = i === 0;
            return `<text x="${cx}" y="${startY + i * lineHeight}" text-anchor="middle" font-size="${bold ? 14 : 12}" font-weight="${bold ? 600 : 400}" fill="${bold ? '#0f172a' : '#64748b'}">${line}</text>`;
          }).join('');
          return `
            <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
            ${text}
          `;
        }

        function svgArrow(x1, y1, x2, y2, label, labelY) {
          const midX = (x1 + x2) / 2;
          const labelWidth = label.length * 6.2 + 10;
          return `
            <line x1="${x1}" y1="${y1}" x2="${x2 - 7}" y2="${y2}" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrowhead)"/>
            <rect x="${midX - labelWidth / 2}" y="${labelY - 11}" width="${labelWidth}" height="17" fill="#fafafa"/>
            <text x="${midX}" y="${labelY + 3}" text-anchor="middle" font-size="11.5" font-weight="500" fill="#475569">${label}</text>
          `;
        }

        const AUTH_SVG = `
          <svg class="diagram-svg" viewBox="0 0 850 160" xmlns="http://www.w3.org/2000/svg">
            ${svgDefs()}
            ${svgBox(20, 32, 180, 76, ['Client', 'Browser'])}
            ${svgBox(320, 32, 180, 76, ['Akamai', 'Functions'])}
            ${svgBox(600, 32, 230, 76, ['AAM (API Gateway)', 'auth-server'])}
            ${svgArrow(200, 63, 320, 63, '1. login', 49)}
            ${svgArrow(320, 93, 200, 93, '3. JWT', 123)}
            ${svgArrow(500, 70, 600, 70, '2. /login', 56)}
          </svg>
        `;

        const CHAT_SVG = `
          <svg class="diagram-svg" viewBox="0 0 1180 160" xmlns="http://www.w3.org/2000/svg">
            ${svgDefs()}
            ${svgBox(20, 32, 170, 76, ['Client', 'Browser'])}
            ${svgBox(280, 32, 210, 76, ['Akamai Functions', 'Wasm Function'])}
            ${svgBox(580, 32, 230, 76, ['AAM (AI Gateway)', 'jwt-auth-inbound'])}
            ${svgBox(900, 32, 260, 76, ['LLM Backend', 'Akamai Cloud', 'google-gemma-4-e4b-it'])}
            ${svgArrow(190, 70, 280, 70, '4. chat + JWT', 56)}
            ${svgArrow(490, 70, 580, 70, '5. /chat Bearer JWT', 56)}
            ${svgArrow(810, 70, 900, 70, '6. JWT valid → forward', 56)}
          </svg>
        `;

        function DiagramSection({ title, svg }) {
          return h('div', { className: "w-full" },
            h('p', { className: "text-xs font-semibold text-slate-400 tracking-[0.12em] uppercase mb-3 pb-2 border-b border-slate-200" }, title),
            h('div', {
              className: "w-full overflow-x-auto",
              dangerouslySetInnerHTML: { __html: svg }
            })
          );
        }

        function ArchDiagram() {
          return h('div', { className: "w-full space-y-8" },
            h(DiagramSection, { title: 'Authentication', svg: AUTH_SVG }),
            h(DiagramSection, { title: 'Chat / Inference', svg: CHAT_SVG })
          );
        }

        // ---------------------------------------------------------------
        // Chat app (logic unchanged from before the redesign)
        // ---------------------------------------------------------------

        const LOGIN_URL = '/api/login';
        const GATEWAY_URL = '/api/chat';
        const MODEL = 'google-gemma-4-e4b-it/google/gemma-4-E4B-it';

        const MAX_AUTO_RETRIES = 1;
        const CLIENT_TIMEOUT_MS = 28000;
        const OVERALL_DEADLINE_MS = 60000;
        const RETRY_BACKOFF_MS = 600;
        const LOADING_MESSAGE = 'Generating response…';

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function classifyError(status, err) {
          if (err?.name === 'AbortError') return { kind: 'timeout', retryable: true };
          if (status === 504 || status === 500) return { kind: 'timeout', retryable: true };
          if (status === 502 || status === 503) return { kind: 'upstream', retryable: true };
          if (status === 401 || status === 403) return { kind: 'auth', retryable: false };
          if (status === 429) return { kind: 'rate_limit', retryable: true };
          if (typeof status === 'number') return { kind: 'client', retryable: false };
          return { kind: 'network', retryable: true };
        }

        function errorMessageFor(kind) {
          switch (kind) {
            case 'auth':
              return 'Your session token was rejected. Please log in again.';
            case 'client':
              return 'The request could not be processed. Please check your input and try again.';
            default:
              return 'The response took too long and was cancelled. Please try again.';
          }
        }

        marked.setOptions({ breaks: true, gfm: true });

        function Markdown({ content }) {
          const html = DOMPurify.sanitize(marked.parse(content || ''));
          return h('div', {
            className: "markdown-body",
            dangerouslySetInnerHTML: { __html: html }
          });
        }

        function formatLatency(ms) {
          return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(2)}s`;
        }

        function TraceBreadcrumb({ steps }) {
          return h('p', { className: "text-xs text-slate-400 leading-relaxed" },
            steps.map((step, i) => [
              i > 0 && h('span', { key: `sep${i}`, className: "mx-1 text-slate-300" }, '/'),
              h('span', { key: `s${i}` }, step)
            ])
          );
        }

        function LoginForm({ onLogin, loading, error }) {
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');

          const submit = (e) => {
            e.preventDefault();
            if (!username || !password) return;
            onLogin(username, password);
          };

          const inputClass = "w-full px-3 py-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm";

          return h('form', { onSubmit: submit, className: "space-y-4" },
            h('div', null,
              h('label', { className: "block text-xs font-medium text-slate-500 mb-1.5" }, 'Username'),
              h('input', {
                type: "text",
                value: username,
                onChange: (e) => setUsername(e.target.value),
                className: inputClass
              })
            ),
            h('div', null,
              h('label', { className: "block text-xs font-medium text-slate-500 mb-1.5" }, 'Password'),
              h('input', {
                type: "password",
                value: password,
                onChange: (e) => setPassword(e.target.value),
                className: inputClass
              })
            ),
            error && h('p', { className: "text-xs text-red-700" }, error),
            h('button', {
              type: "submit",
              disabled: !username || !password || loading,
              className: "w-full px-4 py-2 bg-slate-900 text-white rounded hover:bg-slate-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-sm font-medium transition-colors"
            }, loading ? 'Logging in…' : 'Log in')
          );
        }

        function AAMChat() {
          const [token, setToken] = useState('');
          const [loggedInAs, setLoggedInAs] = useState('');
          const [loginLoading, setLoginLoading] = useState(false);
          const [loginError, setLoginError] = useState('');
          const [messages, setMessages] = useState([]);
          const [input, setInput] = useState('');
          const [loading, setLoading] = useState(false);
          const [lastFailedRequest, setLastFailedRequest] = useState(null);
          const messagesEndRef = useRef(null);

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages]);

          const [nodeInfo, setNodeInfo] = useState(null);
          useEffect(() => {
            fetch('/api/info')
              .then(r => r.json())
              .then(d => setNodeInfo(d))
              .catch(() => {});
          }, []);

          const handleLogin = async (username, password) => {
            setLoginLoading(true);
            setLoginError('');
            try {
              const response = await fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
              });
              const data = await response.json();
              if (!response.ok || !data.token) {
                throw new Error(data.error === 'invalid_credentials'
                  ? 'Invalid username or password.'
                  : (data.message || 'Login failed.'));
              }
              setToken(data.token);
              setLoggedInAs(username);
            } catch (err) {
              setLoginError(err.message || 'Login failed.');
            } finally {
              setLoginLoading(false);
            }
          };

          const logOut = () => {
            setToken('');
            setLoggedInAs('');
            setMessages([]);
          };

          const attemptChat = async (payloadMessages) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), CLIENT_TIMEOUT_MS);
            try {
              const response = await fetch(GATEWAY_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                  model: MODEL,
                  messages: payloadMessages.map(m => ({
                    role: m.role,
                    content: m.content
                  }))
                }),
                signal: controller.signal
              });

              if (!response.ok) {
                const errorText = await response.text();
                const err = new Error(`API Error: ${response.status} - ${errorText}`);
                err.status = response.status;
                throw err;
              }

              return await response.json();
            } finally {
              clearTimeout(timer);
            }
          };

          const runChat = async (payloadMessages) => {
            const deadline = performance.now() + OVERALL_DEADLINE_MS;

            for (let attempt = 0; attempt <= MAX_AUTO_RETRIES; attempt++) {
              const startTime = performance.now();
              try {
                const data = await attemptChat(payloadMessages);
                return {
                  role: 'assistant',
                  content: data.choices?.[0]?.message?.content || 'No response',
                  usage: data.usage || null,
                  model: data.model || null,
                  latencyMs: performance.now() - startTime
                };
              } catch (error) {
                const { retryable, kind } = classifyError(error.status, error);
                const hasBudget = performance.now() + RETRY_BACKOFF_MS < deadline;
                const hasAttemptsLeft = attempt < MAX_AUTO_RETRIES;

                if (kind === 'auth') {
                  // Session token rejected — force a fresh login rather than
                  // silently retrying with the same bad token.
                  logOut();
                }

                if (retryable && hasAttemptsLeft && hasBudget) {
                  await sleep(RETRY_BACKOFF_MS);
                  continue;
                }

                return {
                  role: 'assistant',
                  content: errorMessageFor(kind),
                  isError: true
                };
              }
            }
          };

          const sendMessage = async (overrideMessages) => {
            let payloadMessages;
            if (overrideMessages) {
              payloadMessages = overrideMessages;
            } else {
              if (!input.trim() || !token) return;
              const userMessage = { role: 'user', content: input };
              payloadMessages = [...messages, userMessage];
              setMessages(prev => [...prev, userMessage]);
              setInput('');
            }

            setLoading(true);
            setLastFailedRequest(null);
            try {
              const resultMessage = await runChat(payloadMessages);
              setMessages(prev => [...prev, resultMessage]);
              if (resultMessage.isError) {
                setLastFailedRequest(payloadMessages);
              }
            } finally {
              setLoading(false);
            }
          };

          const retryLastMessage = () => {
            if (!lastFailedRequest) return;
            setMessages(prev => {
              const idx = prev.length - 1;
              return idx >= 0 && prev[idx].isError ? prev.slice(0, idx) : prev;
            });
            sendMessage(lastFailedRequest);
          };

          const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          };

          return h('div', { className: "flex h-screen bg-white" },
            h('div', { className: "w-72 bg-slate-50 border-r border-slate-200 p-6 flex flex-col space-y-6" },
              h('div', null,
                h('h1', { className: "text-base font-semibold text-slate-900 mb-6 tracking-tight" }, 'AAM Chat'),
                token
                  ? h('div', { className: "space-y-1.5" },
                      h('p', { className: "text-sm text-slate-700" }, 'Logged in as ', h('strong', { className: "font-medium text-slate-900" }, loggedInAs)),
                      h('button', {
                        onClick: logOut,
                        className: "text-xs text-slate-400 hover:text-slate-700 underline underline-offset-2"
                      }, 'Log out')
                    )
                  : h(LoginForm, { onLogin: handleLogin, loading: loginLoading, error: loginError })
              ),

              h('div', { className: "mt-auto pt-6 border-t border-slate-200 space-y-2" },
                h(TraceBreadcrumb, { steps: ['Akamai Functions', 'AAM auth-server', 'AAM AI Gateway'] }),
                nodeInfo && h('div', { className: "text-xs text-slate-400 leading-relaxed" },
                  h('p', null, `Running in ${nodeInfo.city}`),
                  h('p', null, `IP: ${nodeInfo.ip}`)
                )
              )
            ),
            h('div', { className: "flex-1 flex flex-col min-w-0" },
              h('div', { className: "flex-1 overflow-y-auto p-6 space-y-4" },
                messages.length === 0 ?
                  h('div', { className: "flex flex-col items-center justify-center h-full gap-8 px-4" },
                    h('div', { className: "text-center" },
                      h('h2', { className: "text-xl font-semibold text-slate-900 mb-1.5 tracking-tight" }, 'AAM Chat'),
                      h('p', { className: "text-slate-500 text-sm" }, token ? 'Start chatting below' : 'Log in in the sidebar to start chatting')
                    ),
                    h('div', { className: "w-full max-w-5xl border border-slate-200 rounded p-8" },
                      h('p', { className: "text-xs font-semibold text-slate-400 uppercase tracking-[0.12em] mb-6" }, 'Architecture'),
                      h(ArchDiagram)
                    )
                  ) :
                  messages.map((msg, idx) =>
                    h('div', {
                      key: idx,
                      className: `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`
                    },
                      h('div', { className: "flex flex-col max-w-3xl items-" + (msg.role === 'user' ? 'end' : 'start') },
                        h('div', {
                          className: `rounded px-4 py-2.5 ${msg.role === 'user' ? 'bubble-user bg-slate-900 text-white' : (msg.isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-white text-slate-800 border border-slate-200')}`
                        },
                          msg.role === 'assistant'
                            ? h(Markdown, { content: msg.content })
                            : h('p', { className: "whitespace-pre-wrap" }, msg.content)
                        ),
                        msg.isError && idx === messages.length - 1 &&
                          h('button', {
                            onClick: retryLastMessage,
                            className: "mt-1.5 px-2.5 py-1 text-xs font-medium text-red-700 border border-red-200 rounded hover:bg-red-50"
                          }, 'Retry'),
                        msg.role === 'assistant' && (msg.usage || msg.model || msg.latencyMs != null) &&
                          h('p', { className: "text-xs text-slate-400 mt-1.5 px-1" },
                            [
                              msg.model,
                              msg.usage && `prompt: ${msg.usage.prompt_tokens} / completion: ${msg.usage.completion_tokens} / total: ${msg.usage.total_tokens} tokens`,
                              msg.latencyMs != null && formatLatency(msg.latencyMs)
                            ].filter(Boolean).join(' · ')
                          )
                      )
                    )
                  ),
                loading && h('div', { className: "flex justify-start" },
                  h('div', { className: "text-slate-400 text-sm px-1 py-2" }, LOADING_MESSAGE)
                ),
                h('div', { ref: messagesEndRef })
              ),
              h('div', { className: "border-t border-slate-200 bg-white p-4" },
                h('div', { className: "max-w-4xl mx-auto flex space-x-3" },
                  h('textarea', {
                    value: input,
                    onChange: (e) => setInput(e.target.value),
                    onKeyPress: handleKeyPress,
                    placeholder: token ? "Type your message..." : "Log in first...",
                    disabled: !token || loading,
                    rows: 1,
                    className: "flex-1 px-3.5 py-2.5 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-slate-900 focus:border-slate-900 outline-none resize-none disabled:bg-slate-50 disabled:cursor-not-allowed text-sm"
                  }),
                  h('button', {
                    onClick: () => sendMessage(),
                    disabled: !input.trim() || !token || loading,
                    className: "px-5 py-2.5 bg-slate-900 text-white rounded hover:bg-slate-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition-colors font-medium text-sm"
                  }, loading ? 'Sending...' : 'Send')
                )
              )
            )
          );
        }

        ReactDOM.render(h(AAMChat), document.getElementById('root'));
    </script>
</body>
</html>
